# Doc Site Deploy
#
# Builds and deploys the fortemi-react documentation site on new release tags.
# Runs independently from the package publish workflows.
#
# Uses the public @pagenary/publisher npm package. The docsite build tooling is
# isolated under docsite/ (its own package.json + tenants.json), so it never
# touches the pnpm workspace (packages/*, apps/*). Per-package pages are
# generated from packages/*/README.md by docsite/prebuild-packages.mjs.
#
# Published to docs.fortemi.com/react (a sub-path of the shared docs host).
#
# Required Gitea secrets:
#   VAULT_CI_ROLE_ID   — vault AppRole role_id for this repo
#   VAULT_CI_SECRET_ID — vault AppRole secret_id for this repo
#
# Required Gitea variables:
#   DOCSITE_DEPLOY_HOST — docs server hostname
#   DOCSITE_DEPLOY_PORT — docs server SSH port
#   DOCSITE_DEPLOY_USER — deploy user on the docs server
#   DOCSITE_DEPLOY_PATH — absolute path on the docs server

name: Docsite Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'docs/**'
      - 'docsite/**'
      - '.gitea/workflows/docsite-deploy.yml'
  # Allow redeploying the docs site on demand (e.g. a docsite-only fix) without
  # cutting a package release.
  workflow_dispatch: {}

concurrency:
  group: docsite-deploy
  cancel-in-progress: false

jobs:
  deploy-docs:
    name: Build & Deploy Documentation
    runs-on: ubuntu-latest
    container: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # 20
    timeout-minutes: 15

    # Several steps use bashisms (`set -o pipefail`, `${!name}` indirection).
    # The runner's default step shell changed to sh, so pin bash explicitly —
    # the node:20 (bookworm) container ships /bin/bash.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout fortemi-react
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install docsite tooling
        working-directory: docsite
        run: npm ci

      - name: Build doc site
        working-directory: docsite
        run: npm run docs:build

      - name: Verify build output
        run: |
          test -d docsite/dist/fortemi-react || { echo "Missing build output directory"; exit 1; }
          test -f docsite/dist/fortemi-react/index.html || { echo "Missing index.html"; exit 1; }
          test -f docsite/dist/fortemi-react/assets/images/posts/2026-08/fortemi-react-august-2026-hero.png || { echo "Missing August report hero"; exit 1; }
          echo "Build verification passed"
          ls -lah docsite/dist/fortemi-react/

      - name: Install deployment tools
        run: apt-get update && apt-get install -y --no-install-recommends curl jq openssh-client rsync

      - name: Validate deploy configuration
        env:
          DOCSITE_DEPLOY_HOST: ${{ vars.DOCSITE_DEPLOY_HOST }}
          DOCSITE_DEPLOY_PORT: ${{ vars.DOCSITE_DEPLOY_PORT }}
          DOCSITE_DEPLOY_USER: ${{ vars.DOCSITE_DEPLOY_USER }}
          DOCSITE_DEPLOY_PATH: ${{ vars.DOCSITE_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for name in DOCSITE_DEPLOY_HOST DOCSITE_DEPLOY_PORT DOCSITE_DEPLOY_USER DOCSITE_DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "$name Gitea variable is required" >&2
              exit 1
            fi
          done

      - name: Fetch deploy key from vault
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_CACERT: ${{ vars.VAULT_CACERT }}
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
          DEPLOY_SSH_KEY_VAULT_PATH: ${{ vars.DEPLOY_SSH_KEY_VAULT_PATH }}
          DEPLOY_SSH_KEY_VAULT_FIELD: ${{ vars.DEPLOY_SSH_KEY_VAULT_FIELD }}
        run: ci/vault-fetch.sh --spec ci/vault-fetch.docsite-deploy.spec

      - name: Configure SSH key
        run: |
          set -euo pipefail
          test -s "${DEPLOY_SSH_KEY_FILE:?DEPLOY_SSH_KEY_FILE is required}"
          mkdir -p ~/.ssh
          cp "$DEPLOY_SSH_KEY_FILE" ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to docs server
        env:
          DOCSITE_DEPLOY_HOST: ${{ vars.DOCSITE_DEPLOY_HOST }}
          DOCSITE_DEPLOY_PORT: ${{ vars.DOCSITE_DEPLOY_PORT }}
          DOCSITE_DEPLOY_USER: ${{ vars.DOCSITE_DEPLOY_USER }}
          DOCSITE_DEPLOY_PATH: ${{ vars.DOCSITE_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          DOCSITE_DEPLOY_PATH="${DOCSITE_DEPLOY_PATH%/}/"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${DOCSITE_DEPLOY_PORT} -o StrictHostKeyChecking=accept-new" \
            docsite/dist/fortemi-react/ \
            "${DOCSITE_DEPLOY_USER}@${DOCSITE_DEPLOY_HOST}:${DOCSITE_DEPLOY_PATH}"

      - name: Verify deployment
        env:
          DOCSITE_DEPLOY_HOST: ${{ vars.DOCSITE_DEPLOY_HOST }}
          DOCSITE_DEPLOY_PORT: ${{ vars.DOCSITE_DEPLOY_PORT }}
          DOCSITE_DEPLOY_USER: ${{ vars.DOCSITE_DEPLOY_USER }}
          DOCSITE_DEPLOY_PATH: ${{ vars.DOCSITE_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          DOCSITE_DEPLOY_PATH="${DOCSITE_DEPLOY_PATH%/}/"
          ssh -i ~/.ssh/deploy_key -p "$DOCSITE_DEPLOY_PORT" -o StrictHostKeyChecking=accept-new \
            "${DOCSITE_DEPLOY_USER}@${DOCSITE_DEPLOY_HOST}" \
            "test -f '${DOCSITE_DEPLOY_PATH}index.html' && echo 'Deploy verified: index.html present' || { echo 'Deploy failed: index.html missing'; exit 1; }"

      - name: Cleanup SSH keys
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          ci/vault-fetch.sh --cleanup

      - name: Log deployment result
        if: success()
        run: |
          echo "Deployed docs.fortemi.com/react"
          echo "Tag: ${{ gitea.ref }}"
          echo "Commit: ${{ gitea.sha }}"
