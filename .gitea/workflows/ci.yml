name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit-test:
    runs-on: ubuntu-latest
    container: node:22
    # Full coverage includes 1,188 clean-destination presence cases. Allow cold
    # CI scheduling plus the downstream Graph/React checks without dropping cases.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fortemi/core exec vitest run --coverage --reporter=default --reporter=json --outputFile=test-results/core-unit.json
        env:
          VITEST_MAX_WORKERS: 2
      - name: Retain Core unit and coverage evidence
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: core-unit-evidence
          path: |
            packages/core/test-results/core-unit.json
            packages/core/coverage/coverage-summary.json
          retention-days: 14
          if-no-files-found: warn
      - name: Verify immutable remote producer fixture
        run: node packages/core/scripts/verify-remote-producer-fixture.mjs
      # @fortemi/graph now imports @fortemi/core by its published entry point
      # (dist), so build core before running graph's tests.
      - run: pnpm --filter @fortemi/core build
      - run: pnpm --filter @fortemi/graph test
      # @fortemi/react tests import @fortemi/core and @fortemi/graph by their
      # published entry points (dist), so build graph before react's tests
      # (core is already built above).
      - run: pnpm --filter @fortemi/graph build
      - run: pnpm --filter @fortemi/react test

  portable-contract:
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
      - run: pnpm install --frozen-lockfile
      - name: OpenBao release-signing wrapper tests
        run: |
          apt-get update
          apt-get install -y --no-install-recommends jq
          tools/release/cut-tag.test.sh
      - name: Release artifact and publication handoff tests
        run: node --test tools/release/*.test.mjs
      - name: OpenBao Git credential bootstrap tests
        run: tools/git/openbao-approle.test.sh
      - name: Shard + AIWG index conformance gate
        run: pnpm test:portable-contract

  examples:
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
      - run: pnpm install --frozen-lockfile
      # Examples import the library packages by their published dist entry
      # points, so build core → graph → react (dependency order) first.
      - run: pnpm --filter @fortemi/core build
      - run: pnpm --filter @fortemi/graph build
      - run: pnpm --filter @fortemi/react build
      - name: Typecheck all examples
        run: pnpm -r --filter './examples/**' typecheck
      - name: Test examples with unit suites
        run: pnpm -r --filter './examples/**' --if-present test
      - name: Build all examples
        run: pnpm -r --filter './examples/**' build

  examples-e2e:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fortemi/core build
      - run: pnpm --filter @fortemi/graph build
      - run: pnpm --filter @fortemi/react build
      - name: Build the deployable gallery site
        run: pnpm examples:site:build
      - name: Knowledge-workspace semantic upgrade smoke test
        run: pnpm examples:site:e2e
        env:
          CI: true
          HOME: /root

  e2e:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e
        env:
          CI: true
          HOME: /root
      - name: Retain browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: standalone-browser-evidence
          path: |
            apps/standalone/test-results/
            apps/standalone/playwright-report/
          retention-days: 14
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 10
    needs: [typecheck, lint, unit-test, portable-contract]
    steps:
      - uses: actions/checkout@v4
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify clean-installed Core package
        shell: bash
        run: |
          set -euo pipefail
          CORE_VERSION="$(node -p "require('./packages/core/package.json').version")"
          PACK_DIR="/tmp/fortemi-core-ci-pack"
          rm -rf "$PACK_DIR"
          mkdir -p "$PACK_DIR"
          (cd packages/core && pnpm pack --pack-destination "$PACK_DIR")
          node tools/release/verify-core-package.mjs \
            "$PACK_DIR/fortemi-core-${CORE_VERSION}.tgz" \
            "$CORE_VERSION"
      - run: pnpm report:bundle
