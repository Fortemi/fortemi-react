name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  core-unit-partition-1:
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 30
    defaults:
      run:
        working-directory: /tmp/fortemi-core-unit
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed-path disposable unit worktree
        working-directory: ${{ github.workspace }}
        run: git worktree add --detach /tmp/fortemi-core-unit HEAD
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
      - run: pnpm install --frozen-lockfile
      - run: node packages/core/scripts/ci-unit-partitions.mjs run 1
      - name: Retain partition reports and receipt
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: core-unit-partition-1
          path: /tmp/fortemi-core-unit/packages/core/test-results/core-shards/1/
          retention-days: 14
          if-no-files-found: error

  core-unit-partition-2:
    runs-on: ubuntu-latest
    container: node:22
    needs: [core-unit-partition-1]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: /tmp/fortemi-core-unit
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed-path disposable unit worktree
        working-directory: ${{ github.workspace }}
        run: git worktree add --detach /tmp/fortemi-core-unit HEAD
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
      - run: pnpm install --frozen-lockfile
      - run: node packages/core/scripts/ci-unit-partitions.mjs run 2
      - name: Retain partition reports and receipt
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: core-unit-partition-2
          path: /tmp/fortemi-core-unit/packages/core/test-results/core-shards/2/
          retention-days: 14
          if-no-files-found: error

  core-unit-partition-3:
    runs-on: ubuntu-latest
    container: node:22
    needs: [core-unit-partition-2]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: /tmp/fortemi-core-unit
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed-path disposable unit worktree
        working-directory: ${{ github.workspace }}
        run: git worktree add --detach /tmp/fortemi-core-unit HEAD
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
      - run: pnpm install --frozen-lockfile
      - run: node packages/core/scripts/ci-unit-partitions.mjs run 3
      - name: Retain partition reports and receipt
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: core-unit-partition-3
          path: /tmp/fortemi-core-unit/packages/core/test-results/core-shards/3/
          retention-days: 14
          if-no-files-found: error

  unit-test:
    runs-on: ubuntu-latest
    container: node:22
    needs: [core-unit-partition-1, core-unit-partition-2, core-unit-partition-3]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: /tmp/fortemi-core-unit
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed-path disposable unit worktree
        working-directory: ${{ github.workspace }}
        run: git worktree add --detach /tmp/fortemi-core-unit HEAD
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          name: core-unit-partition-1
          path: /tmp/fortemi-core-unit/packages/core/test-results/core-shards/1
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          name: core-unit-partition-2
          path: /tmp/fortemi-core-unit/packages/core/test-results/core-shards/2
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          name: core-unit-partition-3
          path: /tmp/fortemi-core-unit/packages/core/test-results/core-shards/3
      - name: Verify complete test inventory and merge coverage
        run: node packages/core/scripts/ci-unit-partitions.mjs merge
      - name: Retain Core unit and coverage evidence
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: core-unit-evidence
          path: |
            /tmp/fortemi-core-unit/packages/core/test-results/core-unit.json
            /tmp/fortemi-core-unit/packages/core/test-results/core-unit-completeness.json
            /tmp/fortemi-core-unit/packages/core/coverage/coverage-summary.json
          retention-days: 14
          if-no-files-found: warn
      - name: Verify immutable remote producer fixture
        run: node packages/core/scripts/verify-remote-producer-fixture.mjs
      # @fortemi/graph now imports @fortemi/core by its published entry point
      # (dist), so build core before running graph's tests.
      - run: pnpm --filter @fortemi/core build
      - run: pnpm --filter @fortemi/graph test
      # @fortemi/react tests import @fortemi/core and @fortemi/graph by their
      # published entry points (dist), so build graph before react's tests
      # (core is already built above).
      - run: pnpm --filter @fortemi/graph build
      - run: pnpm --filter @fortemi/react test

  portable-contract:
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
      - run: pnpm install --frozen-lockfile
      - name: OpenBao release-signing wrapper tests
        run: |
          apt-get update
          apt-get install -y --no-install-recommends jq
          tools/release/cut-tag.test.sh
      - name: Release artifact and publication handoff tests
        run: node --test tools/release/*.test.mjs
      - name: Core partition completeness and coverage gate tests
        run: node --test packages/core/scripts/ci-unit-partitions.test.mjs packages/core/scripts/ci-progress-reporter.test.mjs
      - name: Immutable candidate search authority
        run: |
          node --test packages/core/scripts/verify-metadata-search-source.test.mjs
          node packages/core/scripts/verify-metadata-search-source.mjs
      - name: OpenBao Git credential bootstrap tests
        run: tools/git/openbao-approle.test.sh
      - name: Shard + AIWG index conformance gate
        run: pnpm test:portable-contract

  examples:
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
      - run: pnpm install --frozen-lockfile
      # Examples import the library packages by their published dist entry
      # points, so build core → graph → react (dependency order) first.
      - run: pnpm --filter @fortemi/core build
      - run: pnpm --filter @fortemi/graph build
      - run: pnpm --filter @fortemi/react build
      - name: Typecheck all examples
        run: pnpm -r --filter './examples/**' typecheck
      - name: Test examples with unit suites
        run: pnpm -r --filter './examples/**' --if-present test
      - name: Build all examples
        run: pnpm -r --filter './examples/**' build

  examples-e2e:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fortemi/core build
      - run: pnpm --filter @fortemi/graph build
      - run: pnpm --filter @fortemi/react build
      - name: Build the deployable gallery site
        run: pnpm examples:site:build
      - name: Knowledge-workspace semantic upgrade smoke test
        run: pnpm examples:site:e2e
        env:
          CI: true
          HOME: /root

  e2e:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e
        env:
          CI: true
          HOME: /root
      - name: Retain browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: standalone-browser-evidence
          path: |
            apps/standalone/test-results/
            apps/standalone/playwright-report/
          retention-days: 14
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 10
    needs: [typecheck, lint, unit-test, portable-contract]
    steps:
      - uses: actions/checkout@v4
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify clean-installed Core package
        shell: bash
        run: |
          set -euo pipefail
          CORE_VERSION="$(node -p "require('./packages/core/package.json').version")"
          PACK_DIR="/tmp/fortemi-core-ci-pack"
          rm -rf "$PACK_DIR"
          mkdir -p "$PACK_DIR"
          (cd packages/core && pnpm pack --pack-destination "$PACK_DIR")
          node tools/release/verify-core-package.mjs \
            "$PACK_DIR/fortemi-core-${CORE_VERSION}.tgz" \
            "$CORE_VERSION" "$PACK_DIR/core-package-receipt.json"
      - name: Retain installed package acceptance evidence
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: core-package-acceptance
          path: |
            /tmp/fortemi-core-ci-pack/core-package-receipt.json
            /tmp/fortemi-core-ci-pack/fortemi-core-*.tgz
          retention-days: 14
          if-no-files-found: warn
      - run: pnpm report:bundle
