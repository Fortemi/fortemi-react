# Internal package publication for the local Gitea registry.
#
# Public npmjs.org distribution is intentionally handled by the GitHub mirror
# in .github/workflows/npm-publish.yml so npm provenance is attached from a
# supported GitHub Actions environment. This Gitea workflow keeps the internal
# registry current without using npmjs.org credentials.

name: Publish Internal Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_to_publish:
        description: 'Signed v* tag to publish internally'
        required: true
        type: string

concurrency:
  group: internal-npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Gitea npm registry
    runs-on: ubuntu-latest
    container: node:22@sha256:62e4daa6819762bbd3072af77cc282ab72c631c4aed30dd7980192babaf385b3
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG_TO_PUBLISH: ${{ github.event.inputs.tag_to_publish }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG_TO_PUBLISH}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          case "$TAG" in
            v*) ;;
            *)
              echo "Release tag must start with v: $TAG" >&2
              exit 1
              ;;
          esac

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "GITHUB_REF=refs/tags/$TAG" >> "$GITHUB_ENV"

      - name: Fetch release tag object
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          TAG="${{ steps.release.outputs.release_tag }}"
          git fetch origin "+refs/tags/${TAG}:refs/tags/${TAG}" --depth=1
          git checkout --detach "refs/tags/${TAG}"

      - name: Verify signed release tag
        run: bash tools/ci/verify-signed-tag.sh

      - name: Verify pnpm supply-chain gates
        run: |
          set -euo pipefail
          node - <<'CHECK'
          const fs = require('node:fs');
          const text = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
          const age = text.match(/^minimumReleaseAge:\s*(\d+)\s*$/m);
          const exotic = text.match(/^blockExoticSubdeps:\s*(true|false)\s*$/m);
          if (!age || Number(age[1]) < 10080) {
            throw new Error('pnpm minimumReleaseAge must be at least 10080 minutes');
          }
          if (!exotic || exotic[1] !== 'true') {
            throw new Error('pnpm blockExoticSubdeps must be true');
          }
          CHECK

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Verify package versions
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          export TAG_VERSION
          node - <<'CHECK'
          const fs = require('node:fs');
          const expected = process.env.TAG_VERSION;
          for (const dir of ['packages/core', 'packages/react']) {
            const pkg = JSON.parse(fs.readFileSync(dir + '/package.json', 'utf8'));
            if (pkg.version !== expected) {
              throw new Error(pkg.name + ' version ' + pkg.version + ' does not match release tag ' + expected);
            }
          }
          CHECK

      - name: Pack and inspect artifacts
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          export TAG_VERSION
          PACK_DIR="/tmp/fortemi-publish-check"
          rm -rf "$PACK_DIR"
          mkdir -p "$PACK_DIR"

          (cd packages/core && pnpm pack --pack-destination "$PACK_DIR")
          (cd packages/react && pnpm pack --pack-destination "$PACK_DIR")

          CORE_TGZ="$PACK_DIR/fortemi-core-${TAG_VERSION}.tgz"
          REACT_TGZ="$PACK_DIR/fortemi-react-${TAG_VERSION}.tgz"
          test -s "$CORE_TGZ"
          test -s "$REACT_TGZ"

          tar -tzf "$CORE_TGZ" > "$PACK_DIR/core-files.txt"
          tar -tzf "$REACT_TGZ" > "$PACK_DIR/react-files.txt"

          if grep -E 'package/(\.aiwg|\.agents|\.codex|\.claude)/' "$PACK_DIR/core-files.txt" "$PACK_DIR/react-files.txt"; then
            echo "Packed artifact contains local AI/operator metadata" >&2
            exit 1
          fi

          tar -xOf "$REACT_TGZ" package/package.json > "$PACK_DIR/react-package.json"
          node - <<'CHECK'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('/tmp/fortemi-publish-check/react-package.json', 'utf8'));
          const dep = pkg.dependencies && pkg.dependencies['@fortemi/core'];
          if (dep !== process.env.TAG_VERSION) {
            throw new Error('@fortemi/react artifact depends on @fortemi/core ' + dep + ', expected ' + process.env.TAG_VERSION);
          }
          CHECK

      - name: Publish packages to Gitea registry
        env:
          GT_PUBLISH_TOKEN: ${{ secrets.GT_PUBLISH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          NODE_AUTH_TOKEN="${GT_PUBLISH_TOKEN:-${NPM_TOKEN:-}}"
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "GT_PUBLISH_TOKEN or NPM_TOKEN is required for internal Gitea package publishing" >&2
            exit 1
          fi

          REGISTRY="${GITHUB_SERVER_URL%/}/api/packages/${GITHUB_REPOSITORY_OWNER}/npm/"
          AUTH_HOST="${REGISTRY#https://}"
          AUTH_HOST="${AUTH_HOST#http://}"
          printf '//%s:_authToken=%s\n' "$AUTH_HOST" "$NODE_AUTH_TOKEN" > ~/.npmrc

          TAG_VERSION="${RELEASE_TAG#v}"
          NPM_TAG="latest"
          if [ "$TAG_VERSION" != "${TAG_VERSION%%-*}" ]; then
            NPM_TAG="next"
            if echo "$TAG_VERSION" | grep -qiE -- '-nightly\.'; then
              NPM_TAG="nightly"
            fi
          fi
          echo "Publishing internal npm dist-tag: $NPM_TAG"

          publish_package() {
            package_dir="$1"
            package_name="$(node -p "require('./${package_dir}/package.json').name")"
            package_version="$(node -p "require('./${package_dir}/package.json').version")"

            if npm view "${package_name}@${package_version}" version --registry "$REGISTRY" >/dev/null 2>&1; then
              echo "${package_name}@${package_version} already exists in Gitea; skipping publish"
            else
              echo "Publishing ${package_name}@${package_version} to Gitea"
              (cd "$package_dir" && pnpm publish --registry "$REGISTRY" --access public --no-git-checks --tag "$NPM_TAG")
            fi

            for attempt in 1 2 3 4 5; do
              published="$(npm view "${package_name}@${package_version}" version --registry "$REGISTRY" --prefer-online --no-update-notifier 2>/dev/null || echo "")"
              if [ "$published" = "$package_version" ]; then
                break
              fi
              echo "Attempt ${attempt}: ${package_name}@${package_version} not visible internally yet; retrying in 10s..."
              sleep 10
              if [ "$attempt" = "5" ]; then
                echo "${package_name}@${package_version} did not become visible in Gitea" >&2
                exit 1
              fi
            done

            for attempt in 1 2 3 4 5; do
              if npm dist-tag add "${package_name}@${package_version}" "$NPM_TAG" --registry "$REGISTRY"; then
                break
              fi
              echo "Attempt ${attempt}: internal dist-tag promotion failed; retrying in 10s..."
              sleep 10
              if [ "$attempt" = "5" ]; then
                echo "internal dist-tag promotion exhausted retries for ${package_name}@${package_version}" >&2
                exit 1
              fi
            done
          }

          publish_package packages/core
          publish_package packages/react
