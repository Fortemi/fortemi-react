# Public npmjs.org publication for the GitHub mirror — OIDC trusted publishing.
#
# Gitea remains the primary CI/internal-registry release path ("verify on
# Gitea"); this workflow is the minimal public distribution leg ("deliver on
# GitHub"). It runs only from signed v* release tags, authenticates via npm
# TRUSTED PUBLISHING (GitHub Actions OIDC — no long-lived NPMJS_TOKEN), and
# attaches npm provenance linking each tarball to this workflow run and the
# source commit SHA.
#
# Cost posture: typecheck/lint/tests run on Gitea for every push AND again for
# the same signed tag in .gitea/workflows/publish.yml. This leg deliberately
# does NOT repeat them — it verifies the signed tag, checks supply-chain gates,
# builds, inspects the packed artifacts, publishes, and verifies provenance.
#
# REQUIREMENTS (one-time, operator-side — per package):
# For EACH of @fortemi/core, @fortemi/graph, @fortemi/react at
# https://www.npmjs.com/package/<name>/access → Publishing access →
# Trusted publisher:
#   Provider:          GitHub Actions
#   Organization/user: Fortemi
#   Repository:        fortemi-react
#   Workflow filename: npm-publish.yml   (basename only, NOT a path)
#   Environment:       (leave blank)
# After the first successful OIDC publish, revoke the legacy NPMJS_TOKEN
# granular token on npmjs.org and delete the NPMJS_TOKEN secret from the
# GitHub mirror — a configured token would silently bypass OIDC.
#
# Trusted publishing requires npm >= 11.5.1 (node:24 digest below ships npm
# 11.12.1). `pnpm publish` delegates the registry PUT to the underlying npm
# CLI, so the container's npm version — not pnpm's — decides OIDC support.
# pnpm is still required for the publish step itself: it rewrites the
# workspace:* protocol ranges to concrete versions at pack time.

name: Publish to npmjs.org

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_to_publish:
        description: 'Signed v* tag to publish'
        required: true
        type: string

concurrency:
  group: npmjs-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish public npm packages with provenance
    runs-on: ubuntu-latest
    container: node:24@sha256:050bf2bbe33c1d6754e060bec89378a79ed831f04a7bb1a53fe45e997df7b3bb
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (ci/digests.txt) — Node 24 action runtime

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node for npmjs.org
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG_TO_PUBLISH: ${{ github.event.inputs.tag_to_publish }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG_TO_PUBLISH}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          case "$TAG" in
            v*) ;;
            *)
              echo "Release tag must start with v: $TAG" >&2
              exit 1
              ;;
          esac

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "GITHUB_REF=refs/tags/$TAG" >> "$GITHUB_ENV"

      - name: Fetch release tag object
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          TAG="${{ steps.release.outputs.release_tag }}"
          git fetch origin "+refs/tags/${TAG}:refs/tags/${TAG}" --depth=1
          git checkout --detach "refs/tags/${TAG}"

      - name: Verify signed release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: bash tools/ci/verify-signed-tag.sh

      - name: Verify pnpm supply-chain gates
        run: |
          set -euo pipefail
          node - <<'CHECK'
          const fs = require('node:fs');
          const text = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
          const age = text.match(/^minimumReleaseAge:\s*(\d+)\s*$/m);
          const exotic = text.match(/^blockExoticSubdeps:\s*(true|false)\s*$/m);
          if (!age || Number(age[1]) < 10080) {
            throw new Error('pnpm minimumReleaseAge must be at least 10080 minutes');
          }
          if (!exotic || exotic[1] !== 'true') {
            throw new Error('pnpm blockExoticSubdeps must be true');
          }
          CHECK

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No typecheck/lint/tests here — the same signed tag is fully verified
      # on Gitea (.gitea/workflows/ci.yml on push, publish.yml at release).
      # GitHub minutes are reserved for the delivery-critical path only.
      - name: Build
        run: pnpm build

      - name: Verify package versions
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          export TAG_VERSION
          node - <<'CHECK'
          const fs = require('node:fs');
          const expected = process.env.TAG_VERSION;
          for (const dir of ['packages/core', 'packages/graph', 'packages/react']) {
            const pkg = JSON.parse(fs.readFileSync(dir + '/package.json', 'utf8'));
            if (pkg.version !== expected) {
              throw new Error(pkg.name + ' version ' + pkg.version + ' does not match release tag ' + expected);
            }
          }
          CHECK

      - name: Pack and inspect artifacts
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          export TAG_VERSION
          PACK_DIR="/tmp/fortemi-publish-check"
          rm -rf "$PACK_DIR"
          mkdir -p "$PACK_DIR"

          (cd packages/core && pnpm pack --pack-destination "$PACK_DIR")
          (cd packages/graph && pnpm pack --pack-destination "$PACK_DIR")
          (cd packages/react && pnpm pack --pack-destination "$PACK_DIR")

          CORE_TGZ="$PACK_DIR/fortemi-core-${TAG_VERSION}.tgz"
          GRAPH_TGZ="$PACK_DIR/fortemi-graph-${TAG_VERSION}.tgz"
          REACT_TGZ="$PACK_DIR/fortemi-react-${TAG_VERSION}.tgz"
          test -s "$CORE_TGZ"
          test -s "$GRAPH_TGZ"
          test -s "$REACT_TGZ"

          tar -tzf "$CORE_TGZ" > "$PACK_DIR/core-files.txt"
          tar -tzf "$GRAPH_TGZ" > "$PACK_DIR/graph-files.txt"
          tar -tzf "$REACT_TGZ" > "$PACK_DIR/react-files.txt"

          if grep -E 'package/(\.aiwg|\.agents|\.codex|\.claude)/' "$PACK_DIR/core-files.txt" "$PACK_DIR/graph-files.txt" "$PACK_DIR/react-files.txt"; then
            echo "Packed artifact contains local AI/operator metadata" >&2
            exit 1
          fi

          tar -xOf "$REACT_TGZ" package/package.json > "$PACK_DIR/react-package.json"
          node - <<'CHECK'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('/tmp/fortemi-publish-check/react-package.json', 'utf8'));
          const expected = process.env.TAG_VERSION;
          for (const name of ['@fortemi/core', '@fortemi/graph']) {
            const dep = pkg.dependencies && pkg.dependencies[name];
            if (dep !== expected) {
              throw new Error('@fortemi/react artifact depends on ' + name + ' ' + dep + ', expected ' + expected);
            }
          }
          CHECK

          node tools/release/verify-core-package.mjs "$CORE_TGZ" "$TAG_VERSION"

      - name: Publish packages to npmjs.org (OIDC trusted publishing + provenance)
        # Tokenless: no NODE_AUTH_TOKEN, no .npmrc auth block. npm >= 11.5.1
        # (11.12.1 in this container) negotiates OIDC against npmjs.org using
        # this workflow's id-token claims. pnpm rewrites workspace:* ranges at
        # pack time and delegates the authenticated PUT to npm.
        #
        # Trusted publishers match on: repository_owner ('Fortemi'), repository
        # name ('fortemi-react'), workflow filename ('npm-publish.yml' —
        # basename, NOT the full path), and optionally environment. A 404 PUT
        # means one of these doesn't match the per-package npmjs.org config.
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          echo "── OIDC publish context ──"
          echo "  repository:       ${GITHUB_REPOSITORY}"
          echo "  repository_owner: ${GITHUB_REPOSITORY_OWNER}"
          echo "  workflow_ref:     ${GITHUB_WORKFLOW_REF}"
          echo "  ref:              ${GITHUB_REF}"
          echo "  npm version:      $(npm --version)"
          echo "  pnpm version:     $(pnpm --version)"
          echo

          TAG_VERSION="${RELEASE_TAG#v}"
          NPM_TAG="latest"
          if [ "$TAG_VERSION" != "${TAG_VERSION%%-*}" ]; then
            NPM_TAG="next"
            if echo "$TAG_VERSION" | grep -qiE -- '-nightly\.'; then
              NPM_TAG="nightly"
            fi
          fi
          echo "Publishing npm dist-tag: $NPM_TAG"

          publish_package() {
            package_dir="$1"
            package_name="$(node -p "require('./${package_dir}/package.json').name")"
            package_version="$(node -p "require('./${package_dir}/package.json').version")"

            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "${package_name}@${package_version} already exists on npmjs.org; skipping publish"
            else
              echo "Publishing ${package_name}@${package_version} to npmjs.org"
              (cd "$package_dir" && pnpm publish --provenance --access public --no-git-checks --tag "$NPM_TAG") 2>&1 | tee "/tmp/publish-${package_name##*/}.txt" || {
                if grep -qE "404.*PUT|is not in this registry" "/tmp/publish-${package_name##*/}.txt"; then
                  echo "✗ 404 PUT — trusted-publisher config mismatch for ${package_name}" >&2
                  echo "  Operator action: https://www.npmjs.com/package/${package_name}/access" >&2
                  echo "  → Trusted publisher must be: GitHub Actions / Fortemi / fortemi-react / npm-publish.yml" >&2
                  exit 1
                fi
                echo "✗ npmjs.org publish failed for ${package_name}" >&2
                exit 1
              }
            fi

            # Visibility check (read-only). The dist-tag is set atomically by
            # --tag at publish time; `npm dist-tag add` promotion was removed —
            # it needs write auth that OIDC trusted publishing does not cover
            # outside the publish PUT itself.
            for attempt in 1 2 3 4 5; do
              published="$(npm view "${package_name}@${package_version}" version --prefer-online --no-update-notifier 2>/dev/null || echo "")"
              if [ "$published" = "$package_version" ]; then
                break
              fi
              echo "Attempt ${attempt}: ${package_name}@${package_version} not visible yet; retrying in 10s..."
              sleep 10
              if [ "$attempt" = "5" ]; then
                echo "${package_name}@${package_version} did not become visible on npmjs.org" >&2
                exit 1
              fi
            done

            tagged="$(npm view "${package_name}" "dist-tags.${NPM_TAG}" --no-update-notifier 2>/dev/null || echo "")"
            if [ "$tagged" != "$package_version" ]; then
              echo "⚠ dist-tag ${NPM_TAG} for ${package_name} points at '${tagged}', expected ${package_version}" >&2
              echo "  (--tag applies at publish; a stale value here means a newer version owns the tag or propagation lag)" >&2
            else
              echo "✓ ${package_name} dist-tag ${NPM_TAG} → ${package_version}"
            fi
          }

          publish_package packages/core
          publish_package packages/graph
          publish_package packages/react

      - name: Verify provenance attestations landed
        # Independent post-publish check: a publish that silently dropped
        # provenance must fail HERE, not at audit time. Read-only npm view;
        # parsed with node (this image ships no jq).
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          echo "Waiting 10s for npmjs.org propagation..."
          sleep 10
          # The check script is written via a top-level heredoc: nesting the
          # heredoc inside the for-loop leaves its CHECK terminator indented,
          # which bash rejects ("here-document delimited by end-of-file").
          cat > /tmp/check-attestation.js <<'CHECK'
          const fs = require('node:fs');
          const view = JSON.parse(fs.readFileSync('/tmp/view.json', 'utf8'));
          const att = view?.dist?.attestations;
          if (!att || !att.url) {
            console.error(`✗ No provenance attestation for ${process.env.PKG_NAME} — OIDC trusted publishing likely mis-configured`);
            process.exit(1);
          }
          console.log(`✓ Provenance attestation present for ${process.env.PKG_NAME}: ${att.url}`);
          CHECK
          for package_name in @fortemi/core @fortemi/graph @fortemi/react; do
            npm view "${package_name}@${TAG_VERSION}" --json > /tmp/view.json 2>/dev/null || {
              echo "✗ Could not fetch ${package_name}@${TAG_VERSION} from npmjs.org" >&2
              exit 1
            }
            PKG_NAME="$package_name" node /tmp/check-attestation.js
          done

      - name: Create GitHub release with packages
        env:
          RELEASE_PLATFORM: github
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_API: ${{ github.api_url }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_PACK_DIR: /tmp/fortemi-publish-check
        run: node tools/release/create-repo-release.mjs
