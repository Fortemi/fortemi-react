<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EX-01 · graph-svg-vanilla</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: #2b2824;
        background: #f4f1ea;
        padding: 2rem;
      }
      main { max-width: 820px; margin: 0 auto; }
      h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
      p.lede { color: #6e665a; margin: 0 0 1.25rem; }
      code { background: #e9e4d8; padding: .1em .35em; border-radius: 4px; }
      #graph {
        background: #faf8f4;
        border: 1px solid #ddd6c8;
        border-radius: 10px;
        overflow: hidden;
        touch-action: none;
      }
      .legend { display: flex; flex-wrap: wrap; gap: .5rem 1rem; margin-top: 1rem; }
      .legend span { display: inline-flex; align-items: center; gap: .4rem; color: #585149; font-size: .85rem; }
      .swatch { width: .8rem; height: .8rem; border-radius: 50%; display: inline-block; }
      footer { margin-top: 1rem; color: #968c7c; font-size: .8rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>EX-01 · graph-svg-vanilla</h1>
      <p class="lede">
        A hand-authored <code>CommunityGraph</code> rendered to interactive SVG using only
        <code>@fortemi/graph</code> — no React, no database, no server. Drag to pan, scroll to zoom,
        hover a node for its label.
      </p>
      <div id="graph"></div>
      <div class="legend" id="legend"></div>
      <footer>Everything you see is one file of TypeScript. Zero framework, zero WASM download.</footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
