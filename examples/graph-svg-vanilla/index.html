<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EX-01 · graph-svg-vanilla</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1ea; --surface: #faf8f4; --ink: #2b2824; --muted: #6e665a;
        --rule: #ddd6c8; --code-bg: #e9e4d8; --accent: #585149; --footer: #968c7c;
        --graph-bg: #faf8f4;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #0e1116; --surface: #161b22; --ink: #e6e9ef; --muted: #8b95a3;
          --rule: #2b333d; --code-bg: #1c232d; --accent: #adb6c4; --footer: #6b7480;
          --graph-bg: #12171d;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0e1116; --surface: #161b22; --ink: #e6e9ef; --muted: #8b95a3;
        --rule: #2b333d; --code-bg: #1c232d; --accent: #adb6c4; --footer: #6b7480;
        --graph-bg: #12171d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: var(--ink);
        background: var(--bg);
        padding: 2rem;
      }
      main { max-width: 820px; margin: 0 auto; }
      h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
      p.lede { color: var(--muted); margin: 0 0 1.25rem; }
      code { background: var(--code-bg); padding: .1em .35em; border-radius: 4px; }
      #graph {
        background: var(--graph-bg);
        border: 1px solid var(--rule);
        border-radius: 10px;
        overflow: hidden;
        touch-action: none;
      }
      .legend { display: flex; flex-wrap: wrap; gap: .5rem 1rem; margin-top: 1rem; }
      .legend span { display: inline-flex; align-items: center; gap: .4rem; color: var(--accent); font-size: .85rem; }
      .swatch { width: .8rem; height: .8rem; border-radius: 50%; display: inline-block; }
      footer { margin-top: 1rem; color: var(--footer); font-size: .8rem; }
      .theme-toggle {
        position: fixed; top: 16px; right: 16px; z-index: 50; display: inline-flex;
        border: 1px solid var(--rule); border-radius: 6px; overflow: hidden;
        background: var(--surface); box-shadow: 0 1px 6px rgba(0, 0, 0, .15);
      }
      .theme-toggle button {
        border: none; background: transparent; color: var(--muted);
        font: 14px/1 system-ui; padding: 5px 11px; cursor: pointer;
      }
      .theme-toggle button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
    </style>
    <script>
      try {
        var v = localStorage.getItem('fortemi-theme')
        if (v === 'light' || v === 'dark') document.documentElement.setAttribute('data-theme', v)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="theme-toggle" role="group" aria-label="Color theme">
      <button data-theme-set="light" aria-label="Light" title="Light">☀</button>
      <button data-theme-set="system" aria-label="System" title="System">◐</button>
      <button data-theme-set="dark" aria-label="Dark" title="Dark">☾</button>
    </div>
    <main>
      <h1>EX-01 · graph-svg-vanilla</h1>
      <p class="lede">
        A hand-authored <code>CommunityGraph</code> rendered to interactive SVG using only
        <code>@fortemi/graph</code> — no React, no database, no server. Drag to pan, scroll to zoom,
        hover a node for its label.
      </p>
      <div id="graph"></div>
      <div class="legend" id="legend"></div>
      <footer>Everything you see is one file of TypeScript. Zero framework, zero WASM download.</footer>
    </main>
    <script>
      // Shared theme control — same fortemi-theme key + data-theme convention as the
      // rest of the gallery. Dispatches a `themechange` event so main.ts can repaint
      // the SVG background for the active theme.
      (function () {
        var KEY = 'fortemi-theme'
        var media = window.matchMedia('(prefers-color-scheme: dark)')
        function pref() {
          try { var v = localStorage.getItem(KEY); return v === 'light' || v === 'dark' ? v : 'system' } catch (e) { return 'system' }
        }
        function mark(p) {
          document.querySelectorAll('[data-theme-set]').forEach(function (b) {
            b.setAttribute('aria-pressed', String(b.getAttribute('data-theme-set') === p))
          })
        }
        function apply(p) {
          if (p === 'system') document.documentElement.removeAttribute('data-theme')
          else document.documentElement.setAttribute('data-theme', p)
          mark(p)
          window.dispatchEvent(new CustomEvent('themechange'))
        }
        document.querySelectorAll('[data-theme-set]').forEach(function (b) {
          b.addEventListener('click', function () {
            var p = b.getAttribute('data-theme-set')
            try { if (p === 'system') localStorage.removeItem(KEY); else localStorage.setItem(KEY, p) } catch (e) {}
            apply(p)
          })
        })
        media.addEventListener('change', function () { if (pref() === 'system') apply('system') })
        apply(pref())
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
